name: Patched Codex releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream stable tag (empty selects latest stable)"
        type: string
      force:
        description: "Build even if upstream and our patch stack have not changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: downstream-release
  cancel-in-progress: false

env:
  CODEX_RELEASE_REPOSITORY: ${{ github.repository }}
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RUSTFLAGS: "-C force-frame-pointers=yes"
  RUST_MIN_STACK: "33554432"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  plan:
    if: >-
      github.repository != 'openai/codex' &&
      (github.event_name == 'workflow_dispatch' || vars.PATCHED_RELEASES_ENABLED == 'true')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      upstream_tag: ${{ steps.select.outputs.upstream_tag }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      toolchain: ${{ steps.prepare.outputs.toolchain }}
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select upstream stable release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_tag="${REQUESTED_TAG:-$(gh api repos/openai/codex/releases/latest --jq .tag_name)}"
          [[ "$upstream_tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          changed=true
          if [[ "$FORCE" != true && -z "$REQUESTED_TAG" ]]; then
            latest_body="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null || true)"
            if [[ "$latest_body" == *"Upstream: $upstream_tag"* && "$latest_body" == *"Maintenance: $GITHUB_SHA"* ]]; then
              changed=false
            fi
          fi
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Apply patches once
        if: steps.select.outputs.changed == 'true'
        id: prepare
        env:
          UPSTREAM_TAG: ${{ steps.select.outputs.upstream_tag }}
        run: |
          python3 scripts/downstream/prepare.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate" \
            "$UPSTREAM_TAG" "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER"
      - name: Install upstream Rust
        if: steps.select.outputs.changed == 'true'
        env:
          RUST_TOOLCHAIN: ${{ steps.prepare.outputs.toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: steps.select.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codex-source-${{ runner.os }}-${{ steps.select.outputs.upstream_tag }}
          restore-keys: |
            codex-source-${{ runner.os }}-
            codex-downloads-${{ runner.os }}-${{ steps.prepare.outputs.toolchain }}-
      - name: Freeze the common source commit
        if: steps.select.outputs.changed == 'true'
        id: freeze
        env:
          CANDIDATE: ${{ steps.prepare.outputs.candidate }}
        run: python3 scripts/downstream/source.py freeze "$CANDIDATE" "$RUNNER_TEMP/source"
      - name: Validate installer and release scripts
        if: steps.select.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s scripts/downstream -p 'test_*.py'
          python3 -m unittest discover -s scripts/install -p test_install_sh.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.select.outputs.changed == 'true'
        with:
          name: frozen-source
          path: ${{ runner.temp }}/source/
          overwrite: true
          compression-level: 0

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            jobs: '4'
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            jobs: '4'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            jobs: '2'
          - target: aarch64-apple-darwin
            runner: macos-15
            jobs: '1'
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      STABLE_GIT_COMMIT: ${{ needs.plan.outputs.source_sha }}
      AWS_LC_SYS_NO_JITTER_ENTROPY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-source
          path: ${{ runner.temp }}/source
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Restore the exact frozen source
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 scripts/downstream/source.py restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source" "$RUNNER_TEMP/candidate" "$SOURCE_SHA"
      - name: Install upstream Rust and native target
        env:
          RUST_TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils build-essential pkg-config libcap-dev libssl-dev cmake clang libclang-dev
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.14.0
      - name: Configure musl dependencies
        if: runner.os == 'Linux'
        run: bash "$RUNNER_TEMP/candidate/.github/scripts/install-musl-build-tools.sh"
      - name: Configure macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl@3
          {
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "OPENSSL_STATIC=1"
            echo "OPENSSL_NO_VENDOR=1"
          } >> "$GITHUB_ENV"
          python3 --version
          xcrun --find dsymutil
      - name: Restore compiled dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ runner.temp }}/candidate/codex-rs -> target
          prefix-key: patched-codex-${{ matrix.target }}-v2
          cache-bin: false
          cache-on-failure: true
          cache-directories: /tmp/codex-package
      - name: Check macOS test compilation before the full build
        if: runner.os == 'macOS'
        run: python3 scripts/downstream/build.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dist" --target "$TARGET" --phase check
      - name: Compile release executables
        run: python3 scripts/downstream/build.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dist" --target "$TARGET" --phase compile
      - name: Run native regression tests
        run: python3 scripts/downstream/build.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dist" --target "$TARGET" --phase test
      - name: Package, sign, and verify both installations
        run: python3 scripts/downstream/build.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/dist" --target "$TARGET" --phase package
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/
          overwrite: true
          compression-level: 0
          retention-days: 3

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frozen-source
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Restore the common source and verify all four packages
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          python3 scripts/downstream/source.py restore "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source" "$RUNNER_TEMP/candidate" "$SOURCE_SHA"
          python3 scripts/downstream/publish.py "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/source" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/dist" "$SOURCE_SHA"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C "$RUNNER_TEMP/candidate" tag "$RELEASE_TAG"
          git -C "$RUNNER_TEMP/candidate" push "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG"
          notes="$RUNNER_TEMP/release-notes.txt"
          cat > "$notes" <<EOF
          Cached/parallel history rendering with up to 24 workers, batched history loading,
          and reuse of unchanged background render prefixes during startup.

          Esc-Esc prompt editing reuses cached history, validates the selected prompt,
          and prepares scrollback replay in the background.
          Ctrl+L preserves upstream clear-screen boundaries during resize and background rendering.

          Upstream: $UPSTREAM_TAG
          Maintenance: $GITHUB_SHA

          Linux x86_64/ARM64 (musl) and macOS Intel/Apple Silicon.
          All four packages come from one frozen source commit and passed native installation checks.
          Includes debug symbols, checksums, and per-platform provenance.
          macOS packages use ad-hoc signatures; they are not Developer ID notarized.
          See scripts/downstream/README.md for installation and rollback.
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/dist/"* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Codex ${RELEASE_TAG#rust-v}" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
